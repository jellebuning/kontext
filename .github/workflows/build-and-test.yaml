name: Build and test

on:
  pull_request:
  workflow_dispatch:
  workflow_call: {}

jobs:
  build:
    # WinUI 3 (Kontext) and ConPTY (Kontext.TerminalHost) only build on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
         dotnet-version: '10.0.x'

      - name: Load nuget cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/unwanted
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: dotnet restore

      - name: Set GitHub OAuth client id
        if: ${{ vars.KONTEXT_GITHUB_CLIENT_ID != '' }}
        shell: pwsh
        env:
          CLIENT_ID: ${{ vars.KONTEXT_GITHUB_CLIENT_ID }}
        run: |
          $path = 'src/Kontext/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json
          $settings.GitHub.ClientId = $env:CLIENT_ID
          $settings | ConvertTo-Json -Depth 5 | Set-Content $path

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger GitHubActions
